<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | Register — InsomniaSensePro</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-950 text-gray-100">

    {% include 'navbar.html' %}

    <section class="max-w-6xl mx-auto px-6 py-14">

        <h1 class="text-3xl font-bold text-center text-violet-200 mb-10">
            Login or Create an Account
        </h1>

        <div class="grid md:grid-cols-2 gap-8">

            <!-- LOGIN CARD -->
            <div class="bg-slate-900 border border-slate-800 shadow-lg rounded-2xl p-8">

                <h2 class="text-2xl font-semibold text-center text-violet-300">
                    Login
                </h2>

                <hr class="my-4 border-slate-700">

                <form action="/login" method="post" class="space-y-4">

                    <div>
                        <label class="block font-medium mb-1" for="username">
                            Username
                        </label>
                        <input required type="text" id="username" name="username"
                            class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 focus:ring-violet-500 focus:outline-none" />
                    </div>

                    <div>
                        <label class="block font-medium mb-1" for="password">
                            Password
                        </label>
                        <input required type="password" id="password" name="password"
                            class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 focus:ring-violet-500 focus:outline-none" />
                    </div>

                    {% if loginError %}
                    <p class="text-red-500 text-sm">
                        Error: {{ loginError }}
                    </p>
                    {% endif %}

                    <div class="flex justify-end">
                        <button type="submit"
                            class="bg-violet-600 hover:bg-violet-500 text-white px-6 py-2 rounded-lg transition">
                            Login
                        </button>
                    </div>

                </form>
            </div>


            <!-- REGISTER CARD -->
            <div class="bg-slate-900 border border-slate-800 shadow-lg rounded-2xl p-8">

                <h2 class="text-2xl font-semibold text-center text-violet-300">
                    Register
                </h2>

                <hr class="my-4 border-slate-700">

                <form action="/register" method="post" class="space-y-4">

                    <div>
                        <label class="block font-medium mb-1" for="name">
                            Username
                        </label>
                        <input required type="text" id="name" name="name"
                            class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 focus:ring-violet-500 focus:outline-none" />
                    </div>

                    <div>
                        <label class="block font-medium mb-1" for="email2">
                            Email
                        </label>
                        <input required type="email" id="email2" name="email"
                            class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 focus:ring-violet-500 focus:outline-none" />
                    </div>

                    <div>
                        <label class="block font-medium mb-1" for="newPass">
                            Create new password
                        </label>
                        <input required type="password" id="newPass" name="newPass"
                            class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 focus:ring-violet-500 focus:outline-none" />
                    </div>

                    <div>
                        <label class="block font-medium mb-1" for="confPass">
                            Confirm password
                        </label>
                        <input required type="password" id="confPass" name="confPass"
                            class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 focus:ring-violet-500 focus:outline-none" />
                    </div>

                    {% if regError %}
                    <p class="text-red-500 text-sm">
                        Error: {{ regError }}
                    </p>
                    {% endif %}

                    <div class="flex justify-end">
                        <button type="submit"
                            class="bg-violet-600 hover:bg-violet-500 text-white px-6 py-2 rounded-lg transition">
                            Register
                        </button>
                    </div>

                </form>
            </div>

        </div>

    </section>

    {% include 'footer.html' %}

</body>

</html>
